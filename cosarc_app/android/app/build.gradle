plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// TODO(release): Create android/key.properties with production keystore details
//   before shipping to the Play Store. See PHASE2_CONFIG_NAV_REPORT.md for
//   the required keys and SHA-1 registration steps.

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// TODO(release): Before publishing to the Play Store, create
// android/key.properties with your production keystore details:
//   storePassword=<keystore password>
//   keyPassword=<key password>
//   keyAlias=<key alias>
//   storeFile=<absolute path to .jks or .keystore file>
// Then add android/key.properties to .gitignore.
// Generate keystore: keytool -genkey -v -keystore ~/cosarc-release.jks \
//   -alias cosarc -keyalg RSA -keysize 2048 -validity 10000

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

apply from: "$flutterSdkPath/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.example.cosarc"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.cosarc"
        minSdkVersion 24 
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            keyAlias keystoreProperties['keyAlias'] ?: 'androiddebugkey'
            keyPassword keystoreProperties['keyPassword'] ?: 'android'
            storeFile keystoreProperties['storeFile']
                ? file(keystoreProperties['storeFile'])
                : file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword keystoreProperties['storePassword'] ?: 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation project(":unityLibrary")
}